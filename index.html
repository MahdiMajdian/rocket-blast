<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ROCKET BLAST 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0a12; }
  body { font-family:"Courier New",monospace; color:#fff; -webkit-font-smoothing:none; }
  #c { display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  .panel {
    position:absolute; padding:6px 10px; background:rgba(8,10,24,.62);
    border:2px solid rgba(255,255,255,.22); letter-spacing:1px; font-weight:bold;
    text-shadow:2px 2px 0 #000; font-size:14px; line-height:1.5;
  }
  #hudL { top:12px; left:12px; }
  #hudR { top:12px; right:12px; text-align:right; }
  #fuelWrap { position:absolute; left:12px; bottom:14px; width:220px; }
  #fuelBar { height:16px; border:2px solid rgba(255,255,255,.35); background:rgba(0,0,0,.5); padding:2px; }
  #fuel { height:100%; width:100%; background:#ffb02e; transition:background .2s; }
  .barLbl { font-size:11px; letter-spacing:2px; margin-bottom:3px; text-shadow:2px 2px 0 #000; }
  #progWrap { position:absolute; right:12px; bottom:14px; width:220px; text-align:right; }
  #progBar { height:16px; border:2px solid rgba(255,255,255,.35); background:rgba(0,0,0,.5); padding:2px; }
  #prog { height:100%; width:0%; background:#5ad2ff; }
  #center { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center;
            flex-direction:column; text-align:center; padding-bottom:11vh; }
  #center .box { margin:0 auto; }
  #center .box { background:rgba(8,10,24,.78); border:3px solid rgba(255,255,255,.3); padding:22px 34px; max-width:min(90vw,640px); }
  h1 { font-size:38px; letter-spacing:6px; margin-bottom:6px; text-shadow:4px 4px 0 #d1345b;
       pointer-events:auto; user-select:none; -webkit-user-select:none;
       -webkit-tap-highlight-color:transparent; }   /* no cursor change: stays unremarkable */
  h2 { font-size:24px; letter-spacing:4px; margin-bottom:10px; text-shadow:3px 3px 0 #000; }
  p  { font-size:14px; letter-spacing:1px; line-height:1.9; opacity:.92; text-shadow:2px 2px 0 #000; }
  .key { display:inline-block; border:2px solid #fff; padding:0 6px; margin:0 2px; background:rgba(255,255,255,.12); }
  .dim { opacity:.6; font-size:12px; }
  .hl { color:#ffd24a; }
  .bad { color:#ff6b6b; }
  .good { color:#7dffa0; }
  #flash { position:absolute; inset:0; background:#ff3b3b; opacity:0; }
  /* GTA-style cheat banner: slides down from the top edge, sits, slides back */
  #cheatBanner {
    position:absolute; left:50%; top:0; transform:translate(-50%,-160%); opacity:0;
    background:rgba(8,10,24,.93); border:2px solid #ffd24a; border-left-width:9px;
    padding:9px 20px; font-weight:bold; letter-spacing:2px; font-size:14px;
    text-shadow:2px 2px 0 #000; white-space:nowrap; max-width:92vw; text-align:left;
    transition:transform .3s cubic-bezier(.2,.9,.3,1.25), opacity .3s;
  }
  #cheatBanner.show { transform:translate(-50%, 88px); opacity:1; }
  body.touch #cheatBanner.show { transform:translate(-50%, 140px); }
  #cheatBanner .cb-t { display:block; font-size:10px; letter-spacing:4px; color:#ffd24a; margin-bottom:3px; }
  #cheatBanner.off { border-color:#ff6b6b; }
  #cheatBanner.off .cb-t { color:#ff6b6b; }
  .panel { pointer-events:auto; transition:border-color .12s; }
  .panel.tapped { border-color:#ffd24a; }
  #invBtn {
    pointer-events:auto; cursor:pointer; margin-top:14px; display:inline-block;
    background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.42); color:#fff;
    font-family:inherit; font-weight:bold; font-size:13px; letter-spacing:1px;
    padding:8px 16px; text-shadow:2px 2px 0 #000; -webkit-tap-highlight-color:transparent;
  }
  #invBtn:hover { background:rgba(255,255,255,.2); border-color:#fff; }
  #subRow { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #subName, #subBtn {
    pointer-events:auto; font-family:inherit; font-weight:bold; font-size:14px;
    letter-spacing:2px; padding:9px 12px; border:2px solid rgba(255,255,255,.45);
    background:rgba(0,0,0,.45); color:#fff; -webkit-tap-highlight-color:transparent;
  }
  #subName { width:180px; text-align:center; text-transform:uppercase; }
  #subName::placeholder { color:rgba(255,255,255,.35); letter-spacing:1px; }
  #subName:focus { outline:none; border-color:#ffd24a; }
  #subBtn { cursor:pointer; background:rgba(255,210,74,.18); border-color:#ffd24a; color:#ffd24a; }
  #subBtn:hover { background:rgba(255,210,74,.34); }
  .boardTitle { margin-top:16px; font-size:10px; letter-spacing:4px; opacity:.6; font-weight:bold; }
  #topTbl { margin:6px auto 0; border-collapse:collapse; font-size:13px; letter-spacing:1px; }
  #topTbl th { font-size:10px; letter-spacing:3px; opacity:.55; padding:0 10px 4px; font-weight:bold; }
  #topTbl td { padding:2px 10px; text-shadow:2px 2px 0 #000; }
  #topTbl td:nth-child(2) { text-align:left; }
  #topTbl td:nth-child(3), #topTbl td:nth-child(4) { text-align:right; }
  #invBtn .sw { color:#ffd24a; }
  #toast { position:absolute; top:26%; left:0; right:0; text-align:center; font-size:28px;
           letter-spacing:5px; font-weight:bold; text-shadow:3px 3px 0 #000; opacity:0; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:30px; text-align:center; }

  /* ---- touch controls: hidden until we see a coarse pointer ---- */
  #touch { display:none; }
  body.touch #touch { display:block; }
  body.touch { touch-action:none; }
  /* clear the bottom of the screen for thumbs */
  /* each bar takes exactly half the width minus the margins, so they can never
     meet no matter how narrow the screen gets */
  body.touch #fuelWrap { top:96px; bottom:auto; left:12px;  right:auto;
                         width:calc(50% - 18px); max-width:none; }
  body.touch #progWrap { top:96px; bottom:auto; right:12px; left:auto;
                         width:calc(50% - 18px); max-width:none; }
  /* and keep the score/lives panels off each other and off the bars */
  body.touch .panel { font-size:12px; padding:5px 8px; max-width:46%; }
  body.touch #center   { padding-bottom:26vh; }
  body.touch #center .box { background:rgba(8,10,24,.95); padding:18px 20px; }
  body.touch h1 { font-size:30px; letter-spacing:4px; }
  #dpad { position:absolute; right:16px; bottom:22px; width:186px; height:186px; }
  .tbtn {
    position:absolute; pointer-events:auto; touch-action:none; user-select:none;
    -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    background:rgba(8,10,24,.55); border:2px solid rgba(255,255,255,.34); color:#fff;
    font-family:inherit; font-weight:bold; font-size:12px; letter-spacing:1px;
    line-height:1.15; text-shadow:2px 2px 0 #000; padding:0;
  }
  .tbtn.on { background:rgba(255,210,74,.5); border-color:#ffd24a; color:#fff; }
  #tUp    { left:62px; top:0;     width:62px; height:62px; }
  #tDown  { left:62px; top:124px; width:62px; height:62px; }
  #tLeft  { left:0;    top:62px;  width:62px; height:62px; }
  #tRight { left:124px;top:62px;  width:62px; height:62px; }
  #tFire  { position:absolute; left:22px; bottom:44px; width:112px; height:112px;
            border-radius:50%; font-size:15px; letter-spacing:2px; }
  #tUp, #tDown, #tLeft, #tRight { font-size:20px; }
  @media (max-width:359px){   /* dpad + fire button no longer both fit at full size */
    #dpad { width:156px; height:156px; right:12px; }
    #tUp{left:52px;top:0;width:52px;height:52px}    #tDown{left:52px;top:104px;width:52px;height:52px}
    #tLeft{left:0;top:52px;width:52px;height:52px}  #tRight{left:104px;top:52px;width:52px;height:52px}
    #tFire { width:96px; height:96px; left:14px; font-size:13px; }
    #tUp, #tDown, #tLeft, #tRight { font-size:18px; }
  }
  @media (max-height:430px){
    #dpad { width:150px; height:150px; bottom:14px; }
    #tUp{left:50px;top:0;width:50px;height:50px} #tDown{left:50px;top:100px;width:50px;height:50px}
    #tLeft{left:0;top:50px;width:50px;height:50px} #tRight{left:100px;top:50px;width:50px;height:50px}
    #tFire { width:92px; height:92px; bottom:26px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="panel" id="hudL">LEVEL 1<br>SCORE 0</div>
  <div class="panel" id="hudR">LIVES ###<br>SPD 0</div>
  <div id="fuelWrap"><div class="barLbl" id="fuelLbl">FUEL</div><div id="fuelBar"><div id="fuel"></div></div></div>
  <div id="progWrap"><div class="barLbl">DISTANCE</div><div id="progBar"><div id="prog"></div></div></div>
  <div id="toast"></div>
  <div id="cheatBanner"></div>
  <div id="center"><div class="box" id="msg"></div></div>
  <div id="flash"></div>
  <div id="touch">
    <div id="dpad">
      <button class="tbtn" id="tUp"    data-k="up">&#9650;</button>
      <button class="tbtn" id="tLeft"  data-k="left">&#9664;</button>
      <button class="tbtn" id="tRight" data-k="right">&#9654;</button>
      <button class="tbtn" id="tDown"  data-k="down">&#9660;</button>
    </div>
    <button class="tbtn" id="tFire" data-k="fire">FIRE</button>
  </div>
</div>
